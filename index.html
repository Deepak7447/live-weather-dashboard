<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Live Weather Dashboard</h1>
    </header>


    <main>
        <section class="search-section">
            <form action="">
                <input type="text" placeholder="Enter City Name">
                <button type="submit">Get Weather</button>
            </form>
        </section>


        <section id="current-weather" class="current-weather-section">
            <h2 id="city-name-date">City Name(Date)</h2>
            <div class="weather-data">
                <p id="temperature">Temperature: --</p>
                <p id="humidity">Humidity: --</p>
                <p id="wind-speed">Wind Speed: --</p>
            </div>
        </section>

        <section>
            <h2>5-Day Forecast</h2>
            <div id="forecast-container" class="forecast-cards-container">
                
            </div>
        </section>
    </main>


    <script src="script.js"></script>

</body>
</html>
